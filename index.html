<!doctype html>
<html lang="en" data-theme="light" data-segment="retail">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Meridian Banking</title>
    <script>
      // Runs before first paint so there's no flash of the wrong theme.
      // Keep the keys in sync with src/theme/preferences.ts.
      (function () {
        var root = document.documentElement
        var theme = null
        var segment = null
        try {
          theme = localStorage.getItem('meridian:theme')
          segment = localStorage.getItem('meridian:segment')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        root.setAttribute('data-theme', theme)
        if (segment === 'retail' || segment === 'premium') {
          root.setAttribute('data-segment', segment)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
